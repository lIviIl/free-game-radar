name: update-feed
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site and post new giveaways
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_EN: ${{ secrets.TELEGRAM_CHAT_EN }}
          TELEGRAM_CHAT_AR: ${{ secrets.TELEGRAM_CHAT_AR }}
        run: python3 build.py
      - name: Commit changes
        run: |
          mkdir -p state
          date -u +%F > state/last_run.txt
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "update feed"
            git push
          fi
